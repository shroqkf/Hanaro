version: "3.8"

# 1개 서비스, 3개의 컨테이너
services:
  centos:
    image: centos:8
    container_name: centlinux
    tty: true
    stdin_open: true
    command: /bin/bash
    volumes:
      - ./data:/root/data

  ubuntu:
    image: ubuntu:latest
    container_name: ubunlinux
    tty: true
    stdin_open: true
    command: /bin/bash
    volumes:
      - ./data2:/root/data

  rocky:
    image: rockylinux:9
    container_name: rocklinux
    tty: true
    stdin_open: true
    command: /bin/bash
    volumes:
      - ./data3:/root/data
